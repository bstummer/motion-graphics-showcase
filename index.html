<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude — Motion Reel 2026</title>
<meta name="description" content="A 15-second motion reel written entirely in code: Canvas 2D, math and Web Audio. No image or audio files.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontcss" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<style>
  :root { --ink:#0F0E0C; --paper:#EFE9DE; --verm:#FF4A1C; --u:1px; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; color:var(--paper);
         -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  #stage { position:absolute; left:0; top:0; width:100vw; height:56.25vw; overflow:hidden; background:var(--ink); contain:strict; }
  #c, #gl, #ov, #hud { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #gl, #ov, #hud { pointer-events:none; }
  #gl { visibility:hidden; }
  body.post #gl { visibility:visible; }       /* opaque, over the raw frame, which stays as its underlay */
  #gl.arrive { opacity:0; animation:fadein .6s cubic-bezier(.4,0,.2,1) forwards; }
  body.post #grain, body.post #vig { display:none; }
  #ov { display:none; }
  body.overlay #ov { display:block; }
  /* film grain: one generated tile, jittered with transforms (compositor only) */
  #grain { position:absolute; left:-12%; top:-12%; width:124%; height:124%; pointer-events:none;
           background-size:calc(var(--u)*300) calc(var(--u)*300); opacity:.55; mix-blend-mode:overlay; will-change:transform; }
  #vig { position:absolute; inset:0; pointer-events:none;
         background:radial-gradient(125% 125% at 50% 48%, rgba(0,0,0,0) 60%, rgba(0,0,0,.20) 100%); }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  /* controls scale with the stage but never below a usable size (phones) */
  .ui { position:absolute; font-size:max(calc(var(--u)*15), 10px); letter-spacing:.14em; text-transform:uppercase;
        color:var(--paper); transition:opacity .35s cubic-bezier(.2,.8,.2,1), color .2s; }
  .ui.light { color:var(--ink); }
  .ui:focus-visible, #gate:focus-visible, #rmplay:focus-visible { outline:calc(var(--u)*2) solid var(--verm); outline-offset:calc(var(--u)*6); }
  #mute { right:calc(var(--u)*48); top:calc(var(--u)*38); opacity:.72; display:flex; align-items:center; gap:max(calc(var(--u)*10), 6px);
          min-height:max(calc(var(--u)*24), 32px); }
  #mute:hover { opacity:1; }
  #mute i { display:inline-flex; gap:calc(var(--u)*3); align-items:flex-end; height:calc(var(--u)*12); }
  #mute i b { width:calc(var(--u)*3); background:currentColor; height:100%; }
  #mute i b:nth-child(2) { height:60%; } #mute i b:nth-child(3) { height:80%; }
  #mute[aria-pressed="true"] i b { height:calc(var(--u)*2); }
  #replay { left:50%; bottom:calc(var(--u)*38); transform:translateX(-50%); opacity:0; pointer-events:none;
            padding:calc(var(--u)*10) calc(var(--u)*16); border:calc(var(--u)*1) solid rgba(239,233,222,.28); }
  #replay.show { opacity:.85; pointer-events:auto; }
  #replay:hover { opacity:1; border-color:var(--verm); }
  #paused { left:50%; bottom:calc(var(--u)*40); transform:translateX(-50%); opacity:0; pointer-events:none; }
  #paused.show { opacity:.8; }
  #toast { left:50%; top:calc(var(--u)*38); transform:translateX(-50%); opacity:0; pointer-events:none; }
  #toast.show { opacity:.9; }
  /* scrubber: a beat ruler with a caret for a playhead */
  #scrub { left:calc(var(--u)*300); right:calc(var(--u)*300); bottom:calc(var(--u)*82); height:max(calc(var(--u)*40), 36px);
           opacity:0; pointer-events:none; touch-action:none; cursor:pointer; }
  #scrub.show { opacity:1; pointer-events:auto; }
  #scrub .rail { position:absolute; left:0; right:0; top:50%; height:calc(var(--u)*2); margin-top:calc(var(--u)*-1);
                 background:currentColor; opacity:.28; }
  #scrub .ticks { position:absolute; left:0; right:0; top:50%; height:calc(var(--u)*10); margin-top:calc(var(--u)*-5); opacity:.35;
                  background:repeating-linear-gradient(to right, currentColor 0 calc(var(--u)*1), transparent calc(var(--u)*1) calc(100% / 30)); }
  #scrub .fill { position:absolute; left:0; right:0; top:50%; height:calc(var(--u)*2); margin-top:calc(var(--u)*-1);
                 background:var(--verm); transform-origin:0 50%; transform:scaleX(0); }
  #scrub .head { position:absolute; left:0; top:50%; width:calc(var(--u)*4); height:calc(var(--u)*26);
                 margin:calc(var(--u)*-13) 0 0 calc(var(--u)*-2); background:var(--verm); }
  #scrub:focus-visible { outline:calc(var(--u)*2) solid var(--verm); outline-offset:calc(var(--u)*4); }
  #gate { position:absolute; inset:0; display:block; width:100%; height:100%; transition:opacity .4s cubic-bezier(.2,.8,.2,1); }
  #gate .gs { position:absolute; left:0; right:0; top:66%; font-size:max(calc(var(--u)*13), 9px); letter-spacing:.22em;
              text-transform:uppercase; color:var(--paper); opacity:.38; }
  #gate.off, .hide { opacity:0 !important; pointer-events:none !important; }
  #rm { position:absolute; left:calc(var(--u)*150); bottom:calc(var(--u)*120); display:none; gap:calc(var(--u)*28); align-items:center;
        font-size:calc(var(--u)*15); letter-spacing:.14em; text-transform:uppercase; }
  #rm.show { display:flex; }
  #rm span { opacity:.5; }
  #rmplay { color:var(--verm); border-bottom:calc(var(--u)*1) solid currentColor; padding-bottom:calc(var(--u)*3); letter-spacing:.14em; text-transform:uppercase; }
  #c.fadein, #gl.fadein { opacity:0; animation:fadein 1.6s cubic-bezier(.4,0,.2,1) .15s forwards; }
  @keyframes fadein { to { opacity:1; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" role="img" aria-label="Claude motion reel: a caret types a prompt, then type, shape, field, space and code scenes resolve into the name Claude."></canvas>
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="ov" aria-hidden="true"></canvas>
  <div id="grain"></div>
  <div id="vig"></div>
  <canvas id="hud" aria-hidden="true"></canvas>
  <button id="gate" aria-label="Play the reel with sound"><span class="gs">sound on · space pause · r restart</span></button>
  <button id="mute" class="ui hide" aria-pressed="false" aria-label="Mute sound"><i><b></b><b></b><b></b></i><span>sound</span></button>
  <button id="replay" class="ui" aria-label="Replay the reel">&#8634;&nbsp; replay</button>
  <div id="paused" class="ui">paused · space to resume</div>
  <div id="toast" class="ui" aria-live="polite"></div>
  <div id="scrub" class="ui" role="slider" tabindex="-1" aria-label="Timeline" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0">
    <i class="rail"></i><i class="ticks"></i><i class="fill"></i><i class="head"></i>
  </div>
  <div id="rm" class="ui"><span>reduced motion is on</span><button id="rmplay">play the reel anyway</button></div>
</div>
<script>
'use strict';
/* ==========================================================================
   CLAUDE — MOTION REEL 2026
   One file. One clock. Every pixel and every sound is computed from t.
   120 BPM · beat = 0.5 s · 30 beats · 15 s
   ========================================================================== */

// ---------- constants -------------------------------------------------------
const W = 1920, H = 1080;
const BPM = 120, BEAT = 60 / BPM, DUR = 15;
const b = n => n * BEAT;                       // beats -> seconds
const COL = {
  ink: '#0F0E0C', paper: '#EFE9DE', verm: '#FF4A1C', gray: '#8F887C',
};
const SERIF = '"Instrument Serif", "Times New Roman", serif';
const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';

// Scene cues, in seconds. Visuals and the score both read from this table,
// so a cut can't drift away from its beat.
const CUE = {
  prompt: b(0), type: b(4), form: b(8), field: b(12), space: b(16),
  code: b(20), riser: b(22), collapse: b(25), hit: b(26), end: b(30),
};

// ---------- math ------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (x, a = 0, c = 1) => (x < a ? a : x > c ? c : x);
const lerp = (a, c, t) => a + (c - a) * t;
const prog = (t, t0, d) => clamp((t - t0) / d);          // 0..1 over [t0, t0+d]
const smooth = x => x * x * (3 - 2 * x);

// ---------- easing ----------------------------------------------------------
// Nothing that moves is linear. Hand-tuned curves + physically based springs.
const Ease = {
  inQuad: x => x * x,
  inCubic: x => x * x * x,
  outCubic: x => 1 - (1 - x) ** 3,
  inOutCubic: x => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  inExpo: x => (x <= 0 ? 0 : 2 ** (10 * x - 10)),
  outExpo: x => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  outBack: (s = 1.70158) => x => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2,
  inBack: (s = 1.70158) => x => (s + 1) * x ** 3 - s * x * x,
};

// CSS-style cubic-bezier, baked to a lookup table (bisection solve = robust).
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const N = 512, lut = new Float32Array(N + 1);
  for (let i = 0; i <= N; i++) {
    const x = i / N; let lo = 0, hi = 1, u = x;
    for (let k = 0; k < 28; k++) {
      u = (lo + hi) / 2;
      const sx = ((ax * u + bx) * u + cx) * u;
      if (sx < x) lo = u; else hi = u;
    }
    lut[i] = ((ay * u + by) * u + cy) * u;
  }
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    const f = x * N, i = f | 0;
    return lut[i] + (lut[i + 1] - lut[i]) * (f - i);
  };
}
const snap = bezier(0.76, 0, 0.24, 1);        // decisive in-out, the house curve
const swift = bezier(0.16, 1, 0.3, 1);        // fast out, long settle

// Underdamped spring step response: 0 -> 1 with natural overshoot and settle.
function spring(x, f = 3, z = 0.4) {
  if (x <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
// Decaying wobble (for squash, follow-through): starts at 0, rings out.
function wob(x, f = 5, z = 0.35) {
  if (x <= 0) return 0;
  return Math.exp(-z * TAU * f * x) * Math.sin(TAU * f * Math.sqrt(1 - z * z) * x);
}

// ---------- deterministic randomness -----------------------------------------
function rng(seed) {
  let a = seed | 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(n) {
  let x = Math.imul((n | 0) ^ 0x9E3779B9, 0x85EBCA6B);
  x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35); x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

// ---------- stage: locked 16:9, letterboxed, DPR-aware -----------------------
const SRC = document.currentScript ? document.currentScript.textContent : '';   // the reel reads itself (see SPACE)
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const glcv = document.getElementById('gl');
const ovcv = document.getElementById('ov');
const ctx0 = cv.getContext('2d', { alpha: false });
let ctx = ctx0;                                   // every draw call goes to whichever target is current
const sub = document.createElement('canvas');     // motion blur: sub-frames render here, then average into cv
const subCtx = sub.getContext('2d', { alpha: false });
const ovCtx = ovcv.getContext('2d');
const hudcv = document.getElementById('hud');
const hudCtx = hudcv.getContext('2d');
let SX = 1, SY = 1, QUALITY = 1, dirty = true;
// Look switches. Blur = temporal supersampling; post = the WebGL finishing pass.
const FX = { blur: true, post: true, overlay: false, loop: false, maxSamples: 16 };
sub.width = sub.height = 1;                        // allocated on demand (see ensureSize)
function ensureSize(c) { if (c.width !== cv.width || c.height !== cv.height) { c.width = cv.width; c.height = cv.height; } }

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  const st = stage.style;
  st.left = Math.floor((vw - cw) / 2) + 'px'; st.top = Math.floor((vh - ch) / 2) + 'px';
  st.width = cw + 'px'; st.height = ch + 'px';
  st.setProperty('--u', (cw / W) + 'px');
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * QUALITY;
  const pw = Math.max(1, Math.round(cw * dpr)), ph = Math.max(1, Math.round(ch * dpr));
  for (const c of [cv, glcv, hudcv]) if (c.width !== pw || c.height !== ph) { c.width = pw; c.height = ph; }
  if (sub.width > 1) ensureSize(sub);                 // the blur buffer and the overlay follow once they exist
  if (FX.overlay) ensureSize(ovcv);
  SX = pw / W; SY = ph / H;
  if (POST.ok) POST.resize(pw, ph);
  dirty = true;
}
window.addEventListener('resize', resize);
// Moving the window to a screen with a different pixel ratio doesn't always fire resize.
(function watchDPR() {
  const mq = window.matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`);
  const on = () => { resize(); watchDPR(); };
  if (mq.addEventListener) mq.addEventListener('change', on, { once: true });
})();

// ---------- drawing helpers ----------------------------------------------------
const _lay = new Map();
// Per-character x offsets measured from prefixes, so kerning survives per-letter animation.
function layout(str, font) {
  const key = font + '|' + str;
  let L = _lay.get(key);
  if (L) return L;
  ctx.font = font;
  const xs = new Float32Array(str.length), ws = new Float32Array(str.length);
  for (let i = 0; i < str.length; i++) xs[i] = ctx.measureText(str.slice(0, i)).width;
  const w = ctx.measureText(str).width;
  for (let i = 0; i < str.length; i++) ws[i] = (i + 1 < str.length ? xs[i + 1] : w) - xs[i];
  const m = ctx.measureText(str);
  L = { str, font, xs, ws, w, asc: m.actualBoundingBoxAscent, desc: m.actualBoundingBoxDescent };
  _lay.set(key, L);
  return L;
}

// Monospace advance per font (cached): mono text never needs per-string measuring.
const _adv = new Map();
function monoAdv(font) {
  let a = _adv.get(font);
  if (a === undefined) { ctx.font = font; a = ctx.measureText('0').width; _adv.set(font, a); }
  return a;
}
// Letter-spaced mono caps for the HUD and annotations (canvas letterSpacing isn't everywhere yet).
function spaced(str, x, y, track, align = 0) {
  const adv = monoAdv(ctx.font) + track;
  const total = adv * str.length - track;
  const x0 = x - total * align;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch !== ' ') ctx.fillText(ch, x0 + adv * i, y);
  }
  return total;
}

// Rect with four independent corner radii (absolute px, clamped like CSS).
// Circle, square, quarter-disc, leaf and D are all this one primitive.
function rrect(c, x, y, w, h, tl, tr, br, bl) {
  const f = Math.min(1, w / Math.max(1e-6, tl + tr), w / Math.max(1e-6, bl + br),
                        h / Math.max(1e-6, tl + bl), h / Math.max(1e-6, tr + br));
  tl *= f; tr *= f; br *= f; bl *= f;
  const H2 = Math.PI / 2;
  c.moveTo(x + tl, y);
  c.lineTo(x + w - tr, y);
  if (tr > 0.01) c.arc(x + w - tr, y + tr, tr, -H2, 0);
  c.lineTo(x + w, y + h - br);
  if (br > 0.01) c.arc(x + w - br, y + h - br, br, 0, H2);
  c.lineTo(x + bl, y + h);
  if (bl > 0.01) c.arc(x + bl, y + h - bl, bl, H2, Math.PI);
  c.lineTo(x, y + tl);
  if (tl > 0.01) c.arc(x + tl, y + tl, tl, Math.PI, Math.PI + H2);
  c.closePath();
}

function fillBG(col) {
  ctx.fillStyle = col;
  ctx.fillRect(-120, -120, W + 240, H + 240);   // overscan so camera shake never shows an edge
}

// Scramble: resolves a string left to right, unresolved chars cycle through code glyphs.
const SCR = '#/\\|_=+*<>{}[]01;:';
function scramble(str, p, seed) {
  if (p >= 1) return str;
  const n = str.length, k = Math.floor(p * (n + 3));
  let out = '';
  for (let i = 0; i < n; i++) {
    const ch = str[i];
    if (i < k - 3 || ch === ' ') out += ch;
    else if (i < k) out += SCR[(hash(seed * 131 + i * 17 + ((p * 60) | 0)) * SCR.length) | 0];
    else out += ' ';
  }
  return out;
}

// ---------- camera: shake + zoom punch on hits (deterministic) ------------------
const HITS = [   // [time, strength]
  [CUE.type, 4], [CUE.form, 6], [CUE.field, 5], [CUE.space, 8], [CUE.code, 4], [CUE.hit, 15],
];
const cam = { x: 0, y: 0, r: 0, z: 1 };
function camera(t) {
  cam.x = 0; cam.y = 0; cam.r = 0; cam.z = 1;
  for (let i = 0; i < HITS.length; i++) {
    const d = t - HITS[i][0], a = HITS[i][1];
    if (d < 0 || d > 0.9) continue;
    const k = Math.exp(-d * 7.5), ph = i * 1.7;
    cam.x += a * k * Math.sin(d * TAU * 13 + ph);
    cam.y += a * k * Math.sin(d * TAU * 11 + ph * 1.3 + 1);
    cam.r += a * 0.0005 * k * Math.sin(d * TAU * 7 + ph);
    cam.z += a * 0.0016 * Math.exp(-d * 12);
  }
  // the riser tightens: a fine tremor that grows until the gap before the hit
  const rs = 3.4 * Ease.inQuad(prog(t, b(22), 1.875)) * (t < 12.875 ? 1 : 0);
  if (rs > 0) { cam.x += rs * Math.sin(t * 91.7); cam.y += rs * Math.sin(t * 77.3 + 1.3); }
  return cam;
}

// ---------- HUD ---------------------------------------------------------------------
// Background tone per moment, so the HUD and DOM controls stay legible on every scene.
function lightBG(t) { return (t >= CUE.type + 0.02 && t < CUE.field + 0.12) || (t >= CUE.hit && t < CUE.hit + IMPACT); }
const LABELS = [
  [CUE.prompt, '01 prompt'], [CUE.type, '02 type'], [CUE.form, '03 form'], [CUE.field, '04 field'],
  [CUE.space, '05 space'], [CUE.code, '06 code'], [CUE.hit, '07 signature'],
];
function timecode(t) {
  const f = Math.floor(t * 60 + 1e-6), ff = f % 60, ss = Math.floor(f / 60) % 60, mm = Math.floor(f / 3600);
  return (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss + ':' + (ff < 10 ? '0' : '') + ff;
}
function drawHUD(t, playing) {
  const light = lightBG(t);
  const fg = light ? COL.ink : COL.paper;
  ctx.fillStyle = fg;
  ctx.textBaseline = 'alphabetic';
  // top-left: slate
  ctx.globalAlpha = 0.78;
  ctx.font = `700 15px ${MONO}`;
  const w0 = spaced('CLAUDE', 48, 56, 2.2);
  ctx.globalAlpha = 0.46;
  ctx.font = `400 15px ${MONO}`;
  spaced('MOTION REEL 2026', 48 + w0 + 16, 56, 2.2);
  // bottom-left: chapter + a four-step beat sequencer
  let li = 0;
  for (let i = 0; i < LABELS.length; i++) if (t >= LABELS[i][0]) li = i;
  let lp = li === 0 ? 1 : prog(t, LABELS[li][0], 0.22);
  if (FX.loop && t >= 14.8) { li = 0; lp = prog(t, 14.8, 0.18); }      // looping: the chapter card returns to 01
  ctx.globalAlpha = 0.78;
  spaced(scramble(LABELS[li][1].toUpperCase(), lp, li + 3), 48 + 4 * 16 + 12, H - 44, 2.2);
  const beat = Math.floor(t / BEAT + 1e-6), frac = t / BEAT - beat;
  for (let i = 0; i < 4; i++) {
    const on = playing && t < DUR && beat % 4 === i;
    ctx.globalAlpha = on ? 1 - 0.55 * frac : 0.22;
    ctx.fillStyle = on ? COL.verm : fg;
    ctx.fillRect(48 + i * 16, H - 55, 10, 10);
  }
  // bottom-right: running timecode
  ctx.fillStyle = fg;
  ctx.globalAlpha = 0.78;
  ctx.font = `500 15px ${MONO}`;
  spaced(timecode(Math.min(t, DUR)), W - 48, H - 44, 2.2, 1);
  ctx.globalAlpha = 1;
  return light;
}

/* ==========================================================================
   01 PROMPT  (beats 0–3)
   The caret takes a brief. "make it move." is typed on a 32nd-note grid so the
   period lands on beat 2; on beat 3 the word obeys itself and hops. Then the
   caret winds up, shoots out as a band and floods the frame on the drop.
   ========================================================================== */
const P = { str: 'make it move.', size: 84, y: 584, key0: 0.25, keyD: b(1 / 8) };
P.font = `500 ${P.size}px ${MONO}`;
P.keyT = i => P.key0 + i * P.keyD;          // i = 12 ('.') -> exactly 1.0 s (beat 2)
function initPrompt() {
  P.adv = monoAdv(P.font);
  P.x0 = Math.round((W - P.adv * (P.str.length + 2)) / 2 + P.adv * 2);
}
function caretRect(t, idle) {
  let n = 0;
  if (!idle) for (let i = 0; i < P.str.length; i++) n += Ease.outCubic(prog(t, P.keyT(i), 0.045));
  return { x: P.x0 + n * P.adv + 3, top: P.y - 72, w: 16, h: 92 };
}

// ---------- input -------------------------------------------------------------------------------
ui.gate.addEventListener('click', play);
for (const [ev, on] of [['pointerenter', true], ['pointerleave', false], ['focus', true], ['blur', false]]) {
  ui.gate.addEventListener(ev, () => { gateHover = on; dirty = true; });
}
ui.rmplay.addEventListener('click', play);

stage.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') scrub.until = performance.now() + 2200; });
